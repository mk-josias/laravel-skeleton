# One container per module, each from an image that holds only its module (modules:purge).
# analytics reaches iam over HTTP at iam.svc; both share APP_KEY, which signs those calls.
# Development values only: in production, set real secrets.

x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE="
  LOG_CHANNEL: stderr
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_USERNAME: distributable
  DB_PASSWORD: distributable
  DB_APP_USERNAME: distributable_app
  DB_APP_PASSWORD: distributable_app
  REDIS_HOST: redis
  CACHE_STORE: redis
  SESSION_DRIVER: array
  QUEUE_CONNECTION: redis
  AUTH_TOKEN_VALIDATION_STRATEGY: rpc   # jwt needs AUTH_JWT_PUBLIC_KEY / AUTH_JWT_PRIVATE_KEY
  IAM_HOST: "http://iam.svc:8000"
  OCTANE_WORKERS: "2"
  BROADCAST_CONNECTION: reverb
  REVERB_APP_ID: distributable
  REVERB_APP_KEY: distributable-key
  REVERB_APP_SECRET: distributable-secret
  REVERB_HOST: localhost   # the Reverb of the container that pushes
  REVERB_PORT: "8080"
  REVERB_SCHEME: http

x-build: &build
  context: .
  dockerfile: docker/Dockerfile
  additional_contexts:
    distributable: ../modular-monolith
    microservices: ../laravel-microservices

x-module: &module
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/up"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:

  iam:
    <<: *module
    build:
      <<: *build
      args:
        RUN_MODULES: iam
    image: distributable-skeleton:iam
    environment:
      <<: *env
      RUN_MODULES: iam
      WITH_CONSUMERS: iam
      SYNC_PERMISSIONS: "true"
    ports:
      - "${IAM_PORT:-8001}:8000"
    networks:
      default:
        aliases: [iam.svc]

  analytics:
    <<: *module
    build:
      <<: *build
      args:
        RUN_MODULES: analytics
    image: distributable-skeleton:analytics
    environment:
      <<: *env
      RUN_MODULES: analytics
      WITH_CONSUMERS: analytics
      WITH_SCHEDULER: "true"   # analytics:compute, hourly
    ports:
      - "${ANALYTICS_PORT:-8002}:8000"

  notifications:
    <<: *module
    build:
      <<: *build
      args:
        RUN_MODULES: notifications
    image: distributable-skeleton:notifications
    environment:
      <<: *env
      RUN_MODULES: notifications
      WITH_CONSUMERS: notifications
      WITH_WORKER: "true"    # the mails, queued
      WITH_REVERB: "true"    # the live push, ws://localhost:8080
    ports:
      - "${NOTIFICATIONS_PORT:-8003}:8000"
      - "${REVERB_PUBLIC_PORT:-8080}:8080"

  postgres:
    build: ./docker/postgres
    image: distributable-postgres:local
    environment:
      POSTGRES_DB: distributable
      POSTGRES_USER: distributable
      POSTGRES_PASSWORD: distributable
      DB_APP_PASSWORD: distributable_app
      MODULE_DATABASES: "iam analytics notifications"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "distributable"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
