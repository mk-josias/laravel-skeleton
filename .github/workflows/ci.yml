name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      # composer.json reaches the packages through path repositories at ../modular-monolith and ../laravel-microservices.
      - uses: actions/checkout@v4
        with:
          path: skeleton

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-distributable-modules
          path: modular-monolith

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-microservices
          path: laravel-microservices

      - uses: shivammathur/setup-php@v2
        with:
          php: '8.4'
          coverage: none

      - name: Install dependencies
        working-directory: skeleton
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Pint, PHPStan, tests
        working-directory: skeleton
        run: composer check

  # The same journey with every module in one container, then with one container per module.
  together-or-apart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compose: [docker-compose.mono.yml, docker-compose.yml]

    steps:
      - uses: actions/checkout@v4
        with:
          path: skeleton

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-distributable-modules
          path: modular-monolith

      - uses: actions/checkout@v4
        with:
          repository: mk-josias/laravel-microservices
          path: laravel-microservices

      - name: Journey
        working-directory: skeleton
        run: tests/e2e/together-or-apart.sh ${{ matrix.compose }}
