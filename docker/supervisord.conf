[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:http]
command=php /app/artisan octane:start --server=swoole --host=0.0.0.0 --port=8000 --workers=%(ENV_OCTANE_WORKERS)s --max-requests=500
autostart=%(ENV_WITH_HTTP)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=php /app/artisan queue:work --sleep=1 --tries=3 --max-jobs=1000
autostart=%(ENV_WITH_WORKER)s
autorestart=true
stopwaitsecs=120
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The WebSocket server the browsers join; the other processes of the container push to it on localhost.
[program:reverb]
command=php /app/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=%(ENV_WITH_REVERB)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One per module set: two publishers reading the same outbox would send its rows out of order.
[program:publisher]
command=php /app/artisan stream:publish
autostart=%(ENV_WITH_PUBLISHER)s
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; One per module set: a second one would run every scheduled task twice.
[program:scheduler]
command=supercronic /app/docker/scheduler.cron
autostart=%(ENV_WITH_SCHEDULER)s
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[include]
files = /tmp/supervisor/*.conf
